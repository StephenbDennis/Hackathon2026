[build-system]
requires = [
    "setuptools",
    "wheel",
    "setuptools-scm",
]

[project]
name = "circuitpython-kineticrgb"
description = "CircuitPython driver for Kinetic Technologies KTD2061 and KTD2052 RGB LED driver IC families."
version = "0.0.0+auto.0"
readme = "README.rst"
authors = [
    {name = "Kinetic Technologies, Inc.", email = "ahuey@kinet-ic.com"}
]
urls = {Homepage = "https://github.com/Kinetic-Technologies-Inc/CircuitPython_KineticRGB"}
keywords = [
    "adafruit",
    "blinka",
    "circuitpython",
    "micropython",
    "rgb",
    "kinetic",
    "ktd2061",
    "ktd2060",
    "ktd2059",
    "ktd2058",
    "ktd2052",
    "ktd2052a",
    "ktd2052b",
    "ktd2052c",
    "ktd2052d",
    "rgb",
    "led",
    "driver",
    "i2c",
    "lighting",
]
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
]
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
# TODO: IF LIBRARY FILES ARE A PACKAGE FOLDER,
#       CHANGE `py_modules = ['...']` TO `packages = ['...']`
py-modules = ["kinetic_rgb"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies = {optional = {file = ["optional_requirements.txt"]}}
